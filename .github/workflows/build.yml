name: Build & Publish ComfyUI Blackwell Image

on:
  # Bi-weekly automated build on the 1st and 15th of every month at 00:00 UTC
  schedule:
    - cron: '0 0 1,15 * *'
  
  # Manual trigger on demand
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild regardless of change detection'
        type: boolean
        required: false
        default: true
      tag_override:
        description: 'Optional custom version tag override'
        required: false
        default: ''

  # Trigger on updates to master (excluding pure documentation edits)
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'docs/**'

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - target: base
            tag_suffix: base
            is_latest: false
          - target: nodes
            tag_suffix: nodes
            is_latest: true
          - target: blender-worker
            tag_suffix: blender-worker
            is_latest: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Repository for Leaked Secrets & Sensitive Credentials
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
        continue-on-error: true

      - name: Check for Upstream & Package Updates
        id: check_updates
        run: |
          EVENT="${{ github.event_name }}"
          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          
          echo "=== Pipeline Trigger Evaluation ==="
          echo "Event: $EVENT"
          echo "Force build flag: $FORCE_BUILD"

          if [ "$EVENT" = "push" ]; then
            echo "Triggered by push event. Proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=Repository files updated" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE_BUILD" = "true" ]; then
            echo "Manual workflow dispatch requested with force_build=true. Proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=Manual forced dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Inspect upstream image and package versions
          python3 -c '
          import subprocess, sys, urllib.request, re, os

          should_build = False
          reasons = []

          # 1. Check upstream base image digest
          upstream_digest = ""
          try:
              cmd_up = ["docker", "run", "--rm", "quay.io/skopeo/stable", "inspect", "docker://ghcr.io/ai-dock/comfyui:latest-cuda", "--format", "{{.Digest}}"]
              upstream_digest = subprocess.check_output(cmd_up, timeout=60).decode().strip()
          except Exception as e:
              print(f"Warning: Failed to fetch upstream digest: {e}")

          published_base_digest = ""
          published_tags = ""
          try:
              cmd_pub = ["docker", "run", "--rm", "quay.io/skopeo/stable", "inspect", f"docker://ghcr.io/{os.environ[\"IMAGE_NAME\"]}:latest", "--format", "{{index .Labels \"upstream.base.digest\"}}"]
              published_base_digest = subprocess.check_output(cmd_pub, timeout=60).decode().strip()
          except Exception:
              published_base_digest = ""

          try:
              cmd_tags = ["docker", "run", "--rm", "quay.io/skopeo/stable", "inspect", f"docker://ghcr.io/{os.environ[\"IMAGE_NAME\"]}:latest", "--format", "{{.RepoTags}}"]
              published_tags = subprocess.check_output(cmd_tags, timeout=60).decode().strip()
          except Exception:
              published_tags = ""

          if upstream_digest and published_base_digest and upstream_digest != published_base_digest:
              should_build = True
              reasons.append(f"Upstream ComfyUI base image updated: {upstream_digest} != {published_base_digest}")
          elif upstream_digest and not published_base_digest:
              print("No base digest label in published image; checking tags and packages...")

          # 2. Check latest PyTorch nightly release
          latest_torch = ""
          try:
              req = urllib.request.Request("https://download.pytorch.org/whl/nightly/cu128/torch/", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  html = resp.read().decode("utf-8")
              matches = re.findall(r"torch-2\.[0-9.]*\.dev[0-9]*", html)
              latest_torch = matches[-1] if matches else ""
          except Exception as e:
              print(f"Warning: Failed to fetch PyTorch nightly index: {e}")

          if latest_torch and latest_torch not in published_tags:
              should_build = True
              reasons.append(f"New PyTorch nightly cu128 wheel detected: {latest_torch} not present in published tags")

          print("=== Update Detection Summary ===")
          print(f"Upstream Base Digest:  {upstream_digest}")
          print(f"Published Base Digest: {published_base_digest}")
          print(f"Latest PyTorch Nightly: {latest_torch}")
          print(f"Published Tags:        {published_tags}")
          print(f"Should Build:          {should_build}")

          reason_str = "; ".join(reasons) if reasons else "No upstream or package updates detected"
          print(f"Decision: {reason_str}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_build={\"true\" if should_build else \"false\"}\n")
              f.write(f"reason={reason_str}\n")
              f.write(f"upstream_digest={upstream_digest}\n")
              f.write(f"latest_torch={latest_torch}\n")
          '

      - name: Free Runner Disk Space (Reclaim ~50 GB)
        if: steps.check_updates.outputs.should_build == 'true'
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Set up Docker Buildx
        if: steps.check_updates.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.check_updates.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Local Image Target (${{ matrix.flavor.target }})
        if: steps.check_updates.outputs.should_build == 'true'
        id: prebuild
        run: |
          TARGET="${{ matrix.flavor.target }}"
          LOCAL_TAG="temp-stage:${TARGET}"
          UPSTREAM_DIGEST="${{ steps.check_updates.outputs.upstream_digest }}"
          LATEST_TORCH="${{ steps.check_updates.outputs.latest_torch }}"

          echo "Building local image for target: ${TARGET}..."
          docker build \
            --target "$TARGET" \
            -t "$LOCAL_TAG" \
            --label "upstream.base.digest=$UPSTREAM_DIGEST" \
            --label "upstream.torch.version=$LATEST_TORCH" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=ComfyUI Blackwell ${TARGET} (RTX 5090 / 5080, sm_120)" \
            -f Dockerfile .

          DATE_TAG=$(date +'%Y%m%d')

          if [ "$TARGET" = "blender-worker" ]; then
            REAL_SEMVER_TAG="blender4.4.3-cuda128-${DATE_TAG}-r${{ github.run_number }}"
            CANONICAL_TAG="blender-worker"
            SHORT_TAG="blender-4.4-worker"
          elif [ "$TARGET" = "base" ]; then
            COMFY_VER=$(docker run --rm "$LOCAL_TAG" git -C /opt/ComfyUI describe --tags --always 2>/dev/null || echo "v0.2.2")
            TORCH_VER=$(docker run --rm "$LOCAL_TAG" /opt/environments/python/comfyui/bin/python -c 'import torch; print(torch.__version__.split("+")[0])')
            CUDA_VER=$(docker run --rm "$LOCAL_TAG" /opt/environments/python/comfyui/bin/python -c 'import torch; print("cu" + torch.version.cuda.replace(".", ""))')
            REAL_SEMVER_TAG="${COMFY_VER}-torch${TORCH_VER}-${CUDA_VER}-base-${DATE_TAG}-r${{ github.run_number }}"
            CANONICAL_TAG="${COMFY_VER}-base-cuda128-sm120"
            SHORT_TAG="base-cuda128-sm120"
          else
            COMFY_VER=$(docker run --rm "$LOCAL_TAG" git -C /opt/ComfyUI describe --tags --always 2>/dev/null || echo "v0.2.2")
            TORCH_VER=$(docker run --rm "$LOCAL_TAG" /opt/environments/python/comfyui/bin/python -c 'import torch; print(torch.__version__.split("+")[0])')
            CUDA_VER=$(docker run --rm "$LOCAL_TAG" /opt/environments/python/comfyui/bin/python -c 'import torch; print("cu" + torch.version.cuda.replace(".", ""))')
            REAL_SEMVER_TAG="${COMFY_VER}-torch${TORCH_VER}-${CUDA_VER}-nodes-${DATE_TAG}-r${{ github.run_number }}"
            CANONICAL_TAG="${COMFY_VER}-cuda128-sm120"
            SHORT_TAG="nodes-cuda128-sm120"
          fi

          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            REAL_SEMVER_TAG="${{ github.event.inputs.tag_override }}-${TARGET}"
          fi

          echo "real_semver_tag=$REAL_SEMVER_TAG" >> "$GITHUB_OUTPUT"
          echo "canonical_tag=$CANONICAL_TAG" >> "$GITHUB_OUTPUT"
          echo "short_tag=$SHORT_TAG" >> "$GITHUB_OUTPUT"
          echo "Generated Pure SemVer Tag: $REAL_SEMVER_TAG"
          echo "Generated Canonical Tag: $CANONICAL_TAG"
          echo "Generated Short Tag: $SHORT_TAG"

      - name: Validate Container Integrity (${{ matrix.flavor.target }})
        if: steps.check_updates.outputs.should_build == 'true'
        run: |
          LOCAL_TAG="temp-stage:${{ matrix.flavor.target }}"
          echo "============================================================"
          echo "Running automated CI validation tests for: ${{ matrix.flavor.target }}"
          echo "============================================================"
          
          if [ "${{ matrix.flavor.target }}" = "base" ]; then
            docker run --rm "$LOCAL_TAG" /opt/environments/python/comfyui/bin/python -c "
            import sys, importlib.util, torch, torchvision, torchvision.ops, torchaudio
            print('=== Base PyTorch & CUDA Blackwell Validation ===')
            print('PyTorch Version:   ', torch.__version__)
            print('CUDA Runtime:      ', torch.version.cuda)
            assert '12.8' in torch.version.cuda, f'FAIL: Expected CUDA 12.8, got {torch.version.cuda}'
            build_config = torch.__config__.show()
            assert 'sm_120' in build_config, 'FAIL: sm_120 compute capability not found'
            assert importlib.util.find_spec('xformers') is None, 'FAIL: xformers still present'
            _ = torchvision.ops.nms

            # ComfyUI core registration
            sys.argv.append('--cpu')
            sys.path.append('/opt/ComfyUI')
            import comfy.options; comfy.options.enable_args_parsing()
            import server, nodes
            print('Total registered nodes in clean ComfyUI core:', len(nodes.NODE_CLASS_MAPPINGS))
            print('Core node count healthy!')
            "
          elif [ "${{ matrix.flavor.target }}" = "nodes" ]; then
            docker run --rm "$LOCAL_TAG" /opt/environments/python/comfyui/bin/python -c "
            import sys, importlib.util, torch, torchvision, torchvision.ops, torchaudio, asyncio
            print('=== Nodes PyTorch & Custom Node Stack Validation ===')
            assert '12.8' in torch.version.cuda, f'FAIL: Expected CUDA 12.8, got {torch.version.cuda}'
            assert 'sm_120' in torch.__config__.show(), 'FAIL: sm_120 missing'
            assert importlib.util.find_spec('xformers') is None, 'FAIL: xformers found'
            _ = torchvision.ops.nms

            import numpy, numba, colour, insightface, onnx, mediapipe
            assert numpy.__version__.startswith('1.'), f'FAIL: Expected NumPy 1.x, got {numpy.__version__}'

            sys.argv.append('--cpu')
            sys.path.append('/opt/ComfyUI')
            sys.path.append('/opt/ComfyUI/custom_nodes/ComfyUI-Manager/glob')
            import comfy.options; comfy.options.enable_args_parsing()
            import server
            loop = asyncio.new_event_loop()
            asyncio.set_event_loop(loop)
            s = server.PromptServer(loop)

            import execution, nodes
            nodes.init_extra_nodes()

            print('Total registered nodes in ComfyUI:', len(nodes.NODE_CLASS_MAPPINGS))
            assert 'VHS_VideoCombine' in nodes.NODE_CLASS_MAPPINGS, 'FAIL: VHS_VideoCombine missing'
            assert 'VHS_LoadVideo' in nodes.NODE_CLASS_MAPPINGS, 'FAIL: VHS_LoadVideo missing'
            assert 'DownloadAndLoadLivePortraitModels' in nodes.NODE_CLASS_MAPPINGS, 'FAIL: LivePortrait missing'
            assert 'LatentSyncNode' in nodes.NODE_CLASS_MAPPINGS, 'FAIL: LatentSync missing'
            assert any('AnimateDiff' in k for k in nodes.NODE_CLASS_MAPPINGS), 'FAIL: AnimateDiff missing'
            print('All custom nodes registered successfully!')
            "
          elif [ "${{ matrix.flavor.target }}" = "blender-worker" ]; then
            echo "=== Blender 4.4 LTS Headless Worker Validation ==="
            docker run --rm "$LOCAL_TAG" blender -b --version
            docker run --rm "$LOCAL_TAG" test -d /opt/blender/4.4/scripts/addons/ComfyUI-BlenderAI-node
            docker run --rm "$LOCAL_TAG" test -x /usr/local/bin/blender
            docker run --rm "$LOCAL_TAG" test -x /opt/scripts/blender_entrypoint.sh
            docker run --rm "$LOCAL_TAG" test -x /opt/scripts/blender_runner.py
            echo "Blender headless binary and scripts verified successfully!"
          fi
          echo "============================================================"
          echo "ALL CI VALIDATION CHECKS PASSED FOR ${{ matrix.flavor.target }}!"
          echo "============================================================"

      - name: Audit Container Filesystem for Exposed Sensitive Data & Keys
        if: steps.check_updates.outputs.should_build == 'true'
        run: |
          LOCAL_TAG="temp-stage:${{ matrix.flavor.target }}"
          echo "============================================================"
          echo "Auditing filesystem for ${{ matrix.flavor.target }}..."
          echo "============================================================"
          docker run --rm "$LOCAL_TAG" bash -c '
          set -e
          LEAKED_FILES=$(find /root /home /opt -maxdepth 4 \( -name "*.env" -o -name "*id_rsa*" -o -name "*id_ed25519*" -o -name "*credentials*" -o -name "*.pem" -o -name "*.key" \) 2>/dev/null | grep -v "/opt/environments" | grep -v "/opt/ai-dock/bin" | grep -v "/usr" || true)
          if [ -n "$LEAKED_FILES" ]; then
            echo "❌ CRITICAL: Sensitive credential files detected in image:"
            echo "$LEAKED_FILES"
            exit 1
          else
            echo "✔ Zero leaked credentials, private keys, or .env files found."
          fi
          '

      - name: Scan Container Image with Aqua Security Trivy (Table Summary)
        if: steps.check_updates.outputs.should_build == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'temp-stage:${{ matrix.flavor.target }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,secret,misconfig'

      - name: Generate Trivy SARIF Report for GitHub Security Tab
        if: steps.check_updates.outputs.should_build == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'temp-stage:${{ matrix.flavor.target }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.flavor.target }}.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy Scan Results to GitHub Security Tab
        if: steps.check_updates.outputs.should_build == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results-${{ matrix.flavor.target }}.sarif'
          category: ${{ matrix.flavor.target }}
        continue-on-error: true

      - name: Upload Trivy Security Scan Artifact to Actions Run
        if: steps.check_updates.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.flavor.target }}-sarif
          path: trivy-results-${{ matrix.flavor.target }}.sarif
          retention-days: 30

      - name: Tag and Push Docker Image
        if: steps.check_updates.outputs.should_build == 'true'
        run: |
          LOCAL_TAG="temp-stage:${{ matrix.flavor.target }}"
          TARGET_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          REAL_TAG="${{ steps.prebuild.outputs.real_semver_tag }}"
          CANONICAL_TAG="${{ steps.prebuild.outputs.canonical_tag }}"
          SHORT_TAG="${{ steps.prebuild.outputs.short_tag }}"

          echo "Pushing immutable real-version tag: ${TARGET_BASE}:${REAL_TAG}"
          docker tag "$LOCAL_TAG" "${TARGET_BASE}:${REAL_TAG}"
          docker push "${TARGET_BASE}:${REAL_TAG}"

          if [ -n "$CANONICAL_TAG" ]; then
            echo "Pushing canonical tag: ${TARGET_BASE}:${CANONICAL_TAG}"
            docker tag "$LOCAL_TAG" "${TARGET_BASE}:${CANONICAL_TAG}"
            docker push "${TARGET_BASE}:${CANONICAL_TAG}"
          fi

          if [ -n "$SHORT_TAG" ]; then
            echo "Pushing short tag: ${TARGET_BASE}:${SHORT_TAG}"
            docker tag "$LOCAL_TAG" "${TARGET_BASE}:${SHORT_TAG}"
            docker push "${TARGET_BASE}:${SHORT_TAG}"
          fi

          if [ "${{ matrix.flavor.is_latest }}" = "true" ]; then
            echo "Pushing latest tag: ${TARGET_BASE}:latest"
            docker tag "$LOCAL_TAG" "${TARGET_BASE}:latest"
            docker push "${TARGET_BASE}:latest"
          fi

      - name: Workflow Run Summary
        run: |
          echo "### Build & Publish Execution Summary for \`${{ matrix.flavor.target }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Target:** \`${{ matrix.flavor.target }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Trigger Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Decision:** \`${{ steps.check_updates.outputs.reason }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_updates.outputs.should_build }}" = "true" ]; then
            echo "* **Published SemVer Tag:** \`${{ steps.prebuild.outputs.real_semver_tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "* **Published Canonical Tag:** \`${{ steps.prebuild.outputs.canonical_tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "* **Published Short Tag:** \`${{ steps.prebuild.outputs.short_tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "* **Validation Status:** Passed all Blackwell sm_120 integrity checks." >> $GITHUB_STEP_SUMMARY
          else
            echo "* **Status:** Skipped build — no upstream base or package updates found." >> $GITHUB_STEP_SUMMARY
          fi
