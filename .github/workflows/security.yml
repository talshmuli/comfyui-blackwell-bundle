name: Security & Sensitive Data Audit

on:
  push:
    branches:
      - master
      - main
      - 'feat/**'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Secrets & Vulnerability Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanner (Verify No Leaked Credentials)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
        continue-on-error: true

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
        continue-on-error: true

      - name: Repository Filesystem Sensitive Data Scan
        run: |
          echo "Scanning codebase for high-risk sensitive patterns..."
          LEAKS=$(grep -rnE "(AIza[0-9A-Za-z-_]{35}|ghp_[0-9A-Za-z]{36}|BEGIN (RSA|OPENSSH) PRIVATE KEY)" . \
            --exclude-dir={.git,.venv,__pycache__} || true)
          if [ -n "$LEAKS" ]; then
            echo "❌ CRITICAL: Potential sensitive credential strings discovered:"
            echo "$LEAKS"
            exit 1
          else
            echo "✔ Clean: No API keys or private certificates detected in source code."
          fi
